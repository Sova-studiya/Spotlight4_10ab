<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost in the School 👻</title>
    <style>
        :root {
            --accent: #9b59b6;
            --bg: #0f172a;
            --correct: #2ecc71;
            --wrong: #e74c3c;
            --card-bg: #1e293b;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .header { text-align: center; padding: 15px; }
        .score-val { color: #f43f5e; font-size: 36px; font-weight: 800; }
        
        #timer-bar {
            width: 320px; height: 12px; background: var(--card-bg);
            border-radius: 20px; margin: 10px auto; border: 2px solid var(--accent);
            overflow: hidden;
        }

        #timer-fill {
            width: 100%; height: 100%; background: var(--accent);
            transition: width 5s linear;
        }

        .school-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 95vw;
            max-width: 600px;
        }

        .room { aspect-ratio: 1/1; perspective: 1000px; }
        .room-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .room.foggy .room-inner { transform: rotateY(180deg); }

        .front, .back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; border: 3px solid rgba(255,255,255,0.1);
        }

        .front { background: white; color: #1e293b; padding: 5px; }
        .back { background: var(--card-bg); transform: rotateY(180deg); font-size: 50px; border-color: var(--accent); }

        .front img { height: 80%; width: 95%; object-fit: contain; }
        .place-label { font-size: 11px; font-weight: 800; color: var(--accent); margin-top: 2px; text-transform: uppercase; text-align: center; line-height: 1; }

        #quiz-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: none; align-items: center; justify-content: center;
            z-index: 100; backdrop-filter: blur(10px);
        }

        .quiz-card {
            background: var(--card-bg);
            width: 90%; max-width: 420px;
            padding: 25px; border-radius: 30px;
            border: 4px solid var(--accent);
            text-align: center;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .q-img-wrap {
            width: 130px; height: 130px; margin: 0 auto 15px;
            border-radius: 20px; background: white; border: 4px solid var(--accent);
            overflow: hidden;
        }
        .q-img-wrap img { width: 100%; height: 100%; object-fit: contain; }

        .options-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

        .option-btn {
            background: #334155; color: white; border: none;
            padding: 15px; border-radius: 12px; cursor: pointer;
            font-size: 17px; font-weight: 600; transition: 0.2s;
        }

        .option-btn.correct { background: var(--correct) !important; color: white; }
        .option-btn.wrong { background: var(--wrong) !important; color: white; }

        .shaking-body { animation: body-shake 0.4s; }
        @keyframes body-shake {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(-4px, 2px); }
            75% { transform: translate(4px, -2px); }
        }
    </style>
</head>
<body id="main-body">

<div class="header">
    <h1 style="margin: 0; font-size: 24px;">Ghost in the School 👻</h1>
    <div style="font-size: 18px; margin-top: 5px;">Score: <span class="score-val" id="score">0</span></div>
    <div id="timer-bar"><div id="timer-fill"></div></div>
</div>

<div class="school-grid" id="grid"></div>

<div id="quiz-overlay">
    <div class="quiz-card">
        <div class="q-img-wrap"><img src="" id="q-img"></div>
        <h2 id="q-text" style="margin: 0; font-size: 22px;">Where was...?</h2>
        <div class="options-list" id="options"></div>
    </div>
</div>

<script>
    function playBoo() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 1.2);
        g.gain.setValueAtTime(0.1, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 1.2);
    }

    const places = [
        "at home", "at school", "at work", "at my uncle's house", 
        "at the cafe", "at the cinema", "at the circus", "at the hospital", 
        "at the party", "at the shops", "at the theatre", "at the zoo", 
        "in bed", "in London", "in the garden", "in the room", 
        "in the park", "on holiday", "with my friend"
    ];

    const kids = [
        {n: 'Alex', g: 'He', e: '.jpg'}, {n: 'Alice', g: 'She', e: '.jpg'},
        {n: 'Dasha', g: 'She', e: '.jpg'}, {n: 'Diana', g: 'She', e: '.jpg'},
        {n: 'Dima', g: 'He', e: '.jpg'}, {n: 'Igor', g: 'He', e: '.png'},
        {n: 'Ivan', g: 'He', e: '.png'}, {n: 'Katerina', g: 'She', e: '.png'},
        {n: 'Katya', g: 'She', e: '.png'}, {n: 'Kira', g: 'She', e: '.jpg'},
        {n: 'Kirill', g: 'He', e: '.png'}, {n: 'Makar', g: 'He', e: '.jpg'},
        {n: 'Masha', g: 'She', e: '.png'}, {n: 'Matvey', g: 'He', e: '.png'},
        {n: 'Nikita', g: 'He', e: '.jpg'}, {n: 'Semyon', g: 'He', e: '.jpg'},
        {n: 'Svyatoslav', g: 'He', e: '.png'}, {n: 'Yaroslav', g: 'He', e: '.png'}
    ];

    let currentGridData = [];
    let score = 0;
    let targetKid = null;
    let isAnswering = false;

    function initRound() {
        isAnswering = false;
        const grid = document.getElementById('grid');
        const overlay = document.getElementById('quiz-overlay');
        const timerFill = document.getElementById('timer-fill');

        grid.innerHTML = "";
        overlay.style.display = "none";
        timerFill.style.transition = "none";
        timerFill.style.width = "100%";
        currentGridData = [];

        // Выбираем 9 случайных ребят и 9 случайных мест
        const roundKids = [...kids].sort(() => 0.5 - Math.random()).slice(0, 9);
        const roundPlaces = [...places].sort(() => 0.5 - Math.random()).slice(0, 9);

        for (let i = 0; i < 9; i++) {
            const kid = roundKids[i];
            const place = roundPlaces[i];
            currentGridData.push({ kid, place });

            const room = document.createElement('div');
            room.className = 'room';
            room.innerHTML = `
                <div class="room-inner">
                    <div class="front">
                        <img src="images/${kid.n}${kid.e}" onerror="this.src='https://via.placeholder.com/150?text=${kid.n}'">
                        <div class="place-label">${place}</div>
                    </div>
                    <div class="back">👻</div>
                </div>
            `;
            grid.appendChild(room);
        }

        setTimeout(() => {
            timerFill.style.transition = "width 5s linear";
            timerFill.style.width = "0%";
        }, 100);

        setTimeout(triggerFog, 5000);
    }

    function triggerFog() {
        playBoo();
        document.getElementById('main-body').classList.add('shaking-body');
        setTimeout(() => document.getElementById('main-body').classList.remove('shaking-body'), 500);
        document.querySelectorAll('.room').forEach(r => r.classList.add('foggy'));
        setTimeout(showQuiz, 1000);
    }

    function showQuiz() {
        const optionsContainer = document.getElementById('options');
        targetKid = currentGridData[Math.floor(Math.random() * 9)];

        document.getElementById('q-img').src = `images/${targetKid.kid.n}${targetKid.kid.e}`;
        document.getElementById('q-text').innerText = `Where was ${targetKid.kid.n}?`;

        const correctStr = `${targetKid.kid.g} was ${targetKid.place}.`;
        let options = [correctStr];

        while(options.length < 4) {
            const rP = places[Math.floor(Math.random() * places.length)];
            const wrongStr = `${targetKid.kid.g} was ${rP}.`;
            if(!options.includes(wrongStr)) options.push(wrongStr);
        }

        options.sort(() => 0.5 - Math.random());
        optionsContainer.innerHTML = "";
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(isAnswering) return;
                isAnswering = true;
                
                if(opt === correctStr) {
                    btn.classList.add('correct');
                    score++;
                } else {
                    btn.classList.add('wrong');
                    Array.from(optionsContainer.children).forEach(b => {
                        if(b.innerText === correctStr) b.classList.add('correct');
                    });
                    score = Math.max(0, score - 1);
                }
                
                document.getElementById('score').innerText = score;
                setTimeout(initRound, 2000);
            };
            optionsContainer.appendChild(btn);
        });

        document.getElementById('quiz-overlay').style.display = "flex";
    }

    initRound();
</script>

</body>
</html>
