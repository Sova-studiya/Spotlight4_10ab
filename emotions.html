<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Scramble - Random Mode</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --error: #d63031;
            --bg: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background: white;
            padding: 35px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 550px;
            border: 4px solid #fff;
        }

        .sentence-display {
            font-size: 26px;
            font-weight: 800;
            color: #2f3542;
            margin-bottom: 25px;
            min-height: 40px;
        }

        .character-area {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            height: 180px;
            margin-bottom: 30px;
            position: relative;
        }

        .char-img {
            height: 100%;
            max-width: 45%;
            object-fit: contain;
            transition: 0.3s;
        }

        .slots-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .letter-slot {
            width: 45px;
            height: 55px;
            border-bottom: 5px solid #ced6e0;
            font-size: 36px;
            font-weight: 900;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .letters-bank {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .key-btn {
            width: 55px;
            height: 55px;
            background: white;
            color: var(--primary);
            border: 3px solid var(--primary);
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .key-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        .key-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .floating-emoji {
            position: absolute;
            top: -20px;
            font-size: 60px;
            opacity: 0;
            transform: scale(0.5);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .win .floating-emoji {
            opacity: 1;
            transform: scale(1) translateY(-20px);
        }

        .win .char-img {
            transform: scale(1.05);
        }

        .next-lvl-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,184,148,0.3);
        }
    </style>
</head>
<body>

<div class="game-container" id="main-stage">
    <div class="sentence-display" id="sentence-text">Yesterday...</div>
    
    <div class="character-area" id="stage">
        </div>
    
    <div class="slots-container" id="slots-row"></div>
    <div class="letters-bank" id="keys-row"></div>
    
    <button class="next-lvl-btn" id="btn-next" onclick="startRound()">NEXT GAME →</button>
</div>

<script>
    const kids = [
        {n: 'Alex', g: 'he', ext: '.jpg'}, {n: 'Alice', g: 'she', ext: '.jpg'},
        {n: 'Dasha', g: 'she', ext: '.jpg'}, {n: 'Diana', g: 'she', ext: '.jpg'},
        {n: 'Dima', g: 'he', ext: '.jpg'}, {n: 'Igor', g: 'he', ext: '.png'},
        {n: 'Ivan', g: 'he', ext: '.png'}, {n: 'Katerina', g: 'she', ext: '.png'},
        {n: 'Katya', g: 'she', ext: '.png'}, {n: 'Kira', g: 'she', ext: '.jpg'},
        {n: 'Kirill', g: 'he', ext: '.png'}, {n: 'Makar', g: 'he', ext: '.jpg'},
        {n: 'Masha', g: 'she', ext: '.png'}, {n: 'Matvey', g: 'he', ext: '.png'},
        {n: 'Nikita', g: 'he', ext: '.jpg'}, {n: 'Semyon', g: 'he', ext: '.jpg'},
        {n: 'Svyatoslav', g: 'he', ext: '.png'}, {n: 'Yaroslav', g: 'he', ext: '.png'}
    ];

    const moods = [
        {word: 'angry', emoji: '💢'}, {word: 'scared', emoji: '😱'}, 
        {word: 'sad', emoji: '😢'}, {word: 'happy', emoji: '😊'}, 
        {word: 'tired', emoji: '🥱'}, {word: 'hungry', emoji: '🍕'}, 
        {word: 'bored', emoji: '😑'}
    ];

    let targetWord = "";
    let typedWord = "";

    function startRound() {
        typedWord = "";
        const stage = document.getElementById('stage');
        const slotsRow = document.getElementById('slots-row');
        const keysRow = document.getElementById('keys-row');
        const sentence = document.getElementById('sentence-text');
        const nextBtn = document.getElementById('btn-next');
        const mainContainer = document.getElementById('main-stage');

        mainContainer.classList.remove('win');
        nextBtn.style.display = "none";
        slotsRow.innerHTML = "";
        keysRow.innerHTML = "";

        // 1. RANDOM KIDS (1 or 2)
        const count = Math.random() > 0.6 ? 2 : 1;
        const pickedKids = [...kids].sort(() => 0.5 - Math.random()).slice(0, count);
        
        stage.innerHTML = "";
        pickedKids.forEach(k => {
            stage.innerHTML += `<img src="images/${k.n}${k.ext}" class="char-img" onerror="this.src='https://via.placeholder.com/150x200?text=${k.n}'">`;
        });

        // 2. RANDOM MOOD
        const moodObj = moods[Math.floor(Math.random() * moods.length)];
        targetWord = moodObj.word;
        stage.innerHTML += `<div class="floating-emoji">${moodObj.emoji}</div>`;

        // 3. SET SENTENCE
        if (count === 2) {
            sentence.innerText = "Yesterday they were...";
        } else {
            const prf = pickedKids[0].g === 'he' ? "he" : "she";
            sentence.innerText = `Yesterday ${prf} was...`;
        }

        // 4. PREPARE SLOTS
        for(let i=0; i < targetWord.length; i++) {
            slotsRow.innerHTML += `<div class="letter-slot" id="s-${i}"></div>`;
        }

        // 5. PREPARE LETTERS
        const letters = targetWord.split('').sort(() => 0.5 - Math.random());
        letters.forEach(char => {
            const b = document.createElement('button');
            b.className = 'key-btn';
            b.innerText = char;
            b.onclick = () => {
                if (char === targetWord[typedWord.length]) {
                    document.getElementById(`s-${typedWord.length}`).innerText = char;
                    typedWord += char;
                    b.disabled = true;
                    
                    if (typedWord === targetWord) {
                        mainContainer.classList.add('win');
                        nextBtn.style.display = "block";
                        sentence.innerHTML = sentence.innerText + ` <span style="color:var(--success)">${targetWord.toUpperCase()}!</span>`;
                    }
                } else {
                    b.style.borderColor = "var(--error)";
                    setTimeout(() => b.style.borderColor = "var(--primary)", 400);
                }
            };
            keysRow.appendChild(b);
        });
    }

    startRound();
</script>

</body>
</html>
