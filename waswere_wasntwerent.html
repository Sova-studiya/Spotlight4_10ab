<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Was/Were Learning Game - Full Class</title>
    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ECC71;
            --danger: #E74C3C;
            --bg: #F0F4F8;
            --text: #2C3E50;
            --card-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            background: white;
            width: 95%;
            max-width: 600px;
            padding: 25px;
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .score-display {
            font-size: 20px;
            font-weight: 700;
            background: #E1F5FE;
            padding: 8px 20px;
            border-radius: 15px;
            color: var(--primary);
        }

        .character-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            height: 160px;
        }

        .img-wrapper {
            height: 100%;
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .img-wrapper img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            border-bottom: 3px solid #eee;
        }

        .hint-container {
            background: #FFF9C4;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            min-height: 60px;
            font-size: 17px;
            line-height: 1.4;
            border: 2px dashed #FBC02D;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .places-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .place-card {
            background: #F8F9FA;
            border: 2px solid #E9ECEF;
            padding: 15px 10px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            user-select: none;
        }

        .place-card.status-was {
            background-color: var(--success);
            color: white;
            border-color: #27AE60;
        }

        .place-card.status-wasnt {
            background-color: var(--danger);
            color: white;
            border-color: #C0392B;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.3);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.9);
            display: none; flex-direction: column; align-items: center;
            justify-content: center; z-index: 1000; color: white;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <div style="font-weight: bold; color: #95a5a6;">PAST SIMPLE</div>
        <div class="score-display">Score: <span id="current-score">0</span> / 30</div>
    </div>

    <div class="character-area" id="box-photos"></div>

    <div class="hint-container" id="box-hint">Prepare your memory...</div>

    <div class="places-grid" id="box-grid"></div>

    <button class="action-btn" id="btn-check">CHECK</button>
</div>

<div id="win-overlay" class="overlay">
    <h1 style="font-size: 50px;">🎉 YOU WIN!</h1>
    <p>Fantastic English skills!</p>
    <button onclick="location.reload()" style="padding: 10px 30px; cursor:pointer; border-radius:10px; border:none; font-weight:bold;">PLAY AGAIN</button>
</div>

<script>
    const dataPlaces = {
        "at home": "🏠", "at school": "🏫", "at work": "💼", "at my uncle's house": "🏡",
        "at the cafe": "☕", "at the cinema": "🎬", "at the circus": "🎪", "at the hospital": "🏥", 
        "at the party": "🥳", "at the shops": "🛍️", "at the theatre": "🎭", "at the zoo": "🦁", 
        "in bed": "🛌", "in London": "🎡", "in the garden": "🌻", "in the room": "🛋️", 
        "in the park": "🌳", "on holiday": "🏖️", "with my friend": "👫"
    };

    // Полный список 18 персонажей с учетом расширений файлов
    const dataKids = [
        {n: 'Alex', s: 'he', ext: '.jpg'}, {n: 'Alice', s: 'she', ext: '.jpg'},
        {n: 'Dasha', s: 'she', ext: '.jpg'}, {n: 'Diana', s: 'she', ext: '.jpg'},
        {n: 'Dima', s: 'he', ext: '.jpg'}, {n: 'Igor', s: 'he', ext: '.png'},
        {n: 'Ivan', s: 'he', ext: '.png'}, {n: 'Katerina', s: 'she', ext: '.png'},
        {n: 'Katya', s: 'she', ext: '.png'}, {n: 'Kira', s: 'she', ext: '.jpg'},
        {n: 'Kirill', s: 'he', ext: '.png'}, {n: 'Makar', s: 'he', ext: '.jpg'},
        {n: 'Masha', s: 'she', ext: '.png'}, {n: 'Matvey', s: 'he', ext: '.png'},
        {n: 'Nikita', s: 'he', ext: '.jpg'}, {n: 'Semyon', s: 'he', ext: '.jpg'},
        {n: 'Svyatoslav', s: 'he', ext: '.png'}, {n: 'Yaroslav', s: 'he', ext: '.png'}
    ];

    let globalScore = 0;
    let currentRoundChoices = [];
    let isHintActive = true;
    let currentSelectedKids = [];

    function startNewRound() {
        const grid = document.getElementById('box-grid');
        const photoBox = document.getElementById('box-photos');
        const hintBox = document.getElementById('box-hint');
        
        grid.innerHTML = "";
        photoBox.innerHTML = "";
        currentRoundChoices = [];
        isHintActive = true;
        hintBox.style.visibility = "visible";

        // Выбираем персонажей (70% - 1, 30% - 2)
        const multiple = Math.random() < 0.3;
        currentSelectedKids = [...dataKids].sort(() => 0.5 - Math.random()).slice(0, multiple ? 2 : 1);
        
        currentSelectedKids.forEach(k => {
            const wrap = document.createElement('div');
            wrap.className = 'img-wrapper';
            wrap.innerHTML = `<img src="images/${k.n}${k.ext}" alt="${k.n}" onerror="this.src='https://via.placeholder.com/140x160/eee/999?text=${k.n}'">`;
            photoBox.appendChild(wrap);
        });

        // Генерируем фразы из 6 случайных мест
        const pool = Object.keys(dataPlaces).sort(() => 0.5 - Math.random()).slice(0, 6);
        let phraseList = [];
        
        pool.forEach(p => {
            const wasPresent = Math.random() > 0.5;
            currentRoundChoices.push({ place: p, correct: wasPresent, user: null });
            
            const subj = multiple ? "We" : "I";
            const verb = wasPresent ? (multiple ? "were" : "was") : (multiple ? "weren't" : "wasn't");
            phraseList.push(`${subj} ${verb} ${p}.`);
        });

        hintBox.innerHTML = phraseList.join(" ");

        // Отрисовка карточек мест
        pool.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'place-card';
            card.innerHTML = `<span>${dataPlaces[p]}</span> ${p}`;
            
            card.onmouseenter = () => {
                if(isHintActive) {
                    hintBox.style.visibility = "hidden";
                    isHintActive = false;
                }
            };

            card.onclick = () => {
                const item = currentRoundChoices[idx];
                if (item.user === null) {
                    item.user = true;
                    card.className = 'place-card status-was';
                } else if (item.user === true) {
                    item.user = false;
                    card.className = 'place-card status-wasnt';
                } else {
                    item.user = null;
                    card.className = 'place-card';
                }
            };
            grid.appendChild(card);
        });
    }

    document.getElementById('btn-check').onclick = () => {
        const allCorrect = currentRoundChoices.every(c => c.user === c.correct);
        
        if (allCorrect) {
            globalScore += 1;
            alert("Well done! That's correct! 🌈");
        } else {
            globalScore -= 2;
            const isPlur = currentSelectedKids.length > 1;
            const feedback = currentRoundChoices.map(c => {
                const s = isPlur ? "They" : currentSelectedKids[0].s.charAt(0).toUpperCase() + currentSelectedKids[0].s.slice(1);
                const v = c.correct ? (isPlur ? "were" : "was") : (isPlur ? "weren't" : "wasn't");
                return `${s} ${v} ${c.place}.`;
            }).join("\n");
            alert("Oops! Not quite right. Remember:\n\n" + feedback);
        }

        document.getElementById('current-score').innerText = globalScore;

        if (globalScore >= 30) {
            document.getElementById('win-overlay').style.display = 'flex';
        } else {
            startNewRound();
        }
    };

    startNewRound();
</script>

</body>
</html>
