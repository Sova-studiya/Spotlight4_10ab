<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<title>English Grammar Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFF7EC;
  --ink: #2B2A4C;
  --muted: #7C7A96;
  --card: #FFFFFF;
  --line: #F0E6D8;
  --soft: #FBF4EA;
  --good: #1FAE7A;
  --good-soft: #E3F7EF;
  --bad: #EF5350;
  --bad-soft: #FDECEC;
  --accent: #5B5BD6;
  --accent-soft: #ECECFD;
  --radius: 26px;
  --shadow: 0 12px 32px rgba(43, 42, 76, .08), 0 2px 6px rgba(43, 42, 76, .04);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-weight: 700;
  color: var(--ink);
  background: var(--bg);
  background-image: radial-gradient(rgba(43,42,76,.05) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* ---------- Верхняя панель ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-left));
  background: rgba(255, 247, 236, .85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.topbar-inner { width: 100%; max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.home-btn {
  width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
  background: var(--card); box-shadow: var(--shadow);
  display: grid; place-items: center; font-size: 20px; transition: transform .15s;
}
.home-btn:hover { transform: translateY(-2px); }
.topbar h1 { margin: 0; font-size: clamp(18px, 4.5vw, 24px); font-weight: 900; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score-chip {
  flex-shrink: 0; padding: 9px 16px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-weight: 900; font-size: 16px;
}
.score-chip:empty { display: none; }
body.on-menu .topbar { display: none; }

/* ---------- Экраны ---------- */
main { max-width: 1100px; margin: 0 auto; padding: 8px 16px calc(32px + env(safe-area-inset-bottom)); }
.screen { display: none; animation: fadeUp .35s ease both; }
.screen.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(18px, 3vw, 28px); }
.layout { display: grid; gap: 18px; }
@media (min-width: 860px) {
  #menu.active { min-height: calc(100vh - 60px); display: flex; flex-direction: column; justify-content: center; }
  .layout { grid-template-columns: 1fr 1fr; align-items: stretch; gap: 24px; }
  main { padding-top: 16px; }
}
.label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 800; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 26px; border-radius: 16px;
  font-weight: 900; font-size: 17px; transition: transform .12s, box-shadow .12s, background .2s;
}
.btn:active { transform: translateY(2px); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.14); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: var(--soft); color: var(--ink); box-shadow: 0 4px 0 var(--line); }
.btn-row { display: flex; gap: 12px; }
.btn-row .btn { flex: 1; }

/* Персонажи */
.char {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.char img { display: block; width: 100%; height: 100%; object-fit: contain; }
.char-tile {
  width: var(--size, 140px); aspect-ratio: 3 / 4;
  background: var(--tint, var(--accent-soft)); border-radius: 22px; padding: 8px 8px 0; overflow: hidden;
}
.char-name { font-weight: 900; font-size: 16px; }

/* ---------- Меню ---------- */
.hero { text-align: center; padding: clamp(24px, 6vw, 56px) 8px clamp(20px, 4vw, 36px); }
.hero-chars { display: flex; justify-content: center; margin-bottom: 14px; }
.hero-chars img { width: clamp(54px, 13vw, 84px); margin: 0 -6px; filter: drop-shadow(0 6px 8px rgba(43,42,76,.12)); animation: bob 3s ease-in-out infinite; }
.hero-chars img:nth-child(2n) { animation-delay: -1.5s; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.hero h2 { margin: 0; font-size: clamp(30px, 7vw, 52px); font-weight: 900; line-height: 1.05; letter-spacing: -.02em; }
.hero p { margin: 10px 0 0; color: var(--muted); font-size: clamp(16px, 3.5vw, 19px); }
.menu-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.game-card {
  text-align: left; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s;
}
.game-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(43,42,76,.12); }
.game-card .art { height: 120px; display: grid; place-items: center; font-size: 56px; background: var(--c); position: relative; }
.game-card .art::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 80% 20%, rgba(255,255,255,.45), transparent 55%); }
.game-card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.game-card .tag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--c2); font-weight: 900; }
.game-card h3 { margin: 0; font-size: 21px; font-weight: 900; }
.game-card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
.game-card .play { margin-top: 12px; color: var(--c2); font-weight: 900; }

/* ---------- Word order ---------- */
.formula { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px; }
.formula .op { font-size: 28px; color: #C9C3D8; font-weight: 900; }
.f-box { border-radius: 20px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 150px; }
.f-chars { background: var(--accent-soft); flex-direction: row; gap: 6px; }
.f-chars .char-tile { --size: clamp(50px, 14vw, 80px); --tint: transparent; padding: 0; }
.f-place { background: #FFF3D6; border: 2px dashed #F2B53A; text-align: center; }
.f-place .emo { font-size: 42px; line-height: 1; }
.f-place .txt { font-weight: 900; color: #A5650B; font-size: 15px; }
.f-sign { flex-direction: column; }
.sign-badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 900; color: #fff; }
.sign-badge.pos { background: var(--good); } .sign-badge.neg { background: var(--bad); } .sign-badge.que { background: #F0A030; }
.sign-word { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 900; }
.feedback { min-height: 30px; text-align: center; font-weight: 900; font-size: 20px; margin-bottom: 10px; }
.feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
.sentence-zone {
  min-height: 74px; padding: 12px; border-radius: 18px; background: var(--soft);
  border: 2px dashed var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
  margin-bottom: 16px; transition: border-color .2s, background .2s;
}
.sentence-zone.good { border-color: var(--good); background: var(--good-soft); }
.sentence-zone.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.sentence-zone:empty::before { content: 'Tap the words in the right order'; color: #B9B3C9; font-size: 15px; }
.word-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 56px; margin-bottom: 20px; }
.chip {
  min-height: 48px; padding: 0 18px; border-radius: 14px; background: #fff; font-weight: 800; font-size: 19px;
  border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); transition: transform .1s;
  animation: pop .2s ease both;
}
.chip:hover { border-color: var(--accent); }
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.sentence-zone .chip { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 0 rgba(0,0,0,.15); }
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------- Emotions ---------- */
#emotions { --accent: #E8590C; --accent-soft: #FFEBDD; }
.em-left { min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.em-sentence { font-size: clamp(26px, 6vw, 36px); font-weight: 900; line-height: 1.2; min-height: 44px; }
.em-sentence .ans { color: var(--good); }
.em-stage { position: relative; display: flex; gap: 12px; justify-content: center; padding-top: 44px; }
.em-stage .char-tile { --size: clamp(120px, 34vw, 170px); }
.em-emoji { position: absolute; top: 0; left: 50%; font-size: 56px; transform: translate(-50%, 10px) scale(.4); opacity: 0;
  transition: .5s cubic-bezier(.175, .885, .32, 1.275); z-index: 2; }
.win .em-emoji { opacity: 1; transform: translate(-50%, -14px) scale(1); }
.win .em-stage .char-tile { animation: hop .5s; }
@keyframes hop { 40% { transform: translateY(-10px); } }
.em-right { display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.slots { display: flex; justify-content: center; gap: clamp(6px, 1.6vw, 10px); }
.slot {
  width: clamp(38px, 10vw, 54px); height: clamp(48px, 12vw, 64px); border-radius: 12px; background: var(--soft);
  border-bottom: 4px solid var(--line); display: grid; place-items: center;
  font-size: clamp(24px, 6vw, 34px); font-weight: 900; color: var(--accent); text-transform: uppercase;
}
.slot.filled { background: var(--accent-soft); border-color: var(--accent); animation: pop .2s; }
.keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.key {
  width: clamp(50px, 13vw, 60px); height: clamp(50px, 13vw, 60px); border-radius: 16px; background: #fff;
  border: 3px solid var(--accent); color: var(--accent); font-size: 26px; font-weight: 900; box-shadow: 0 5px 0 var(--accent-soft);
  transition: transform .1s, background .15s;
}
.key:hover:not(:disabled) { background: var(--accent); color: #fff; }
.key:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.key:disabled { opacity: .25; cursor: default; }
.key.wrong { border-color: var(--bad); color: var(--bad); animation: shake .3s; }

/* ---------- Ghost ---------- */
#ghost { --accent: #8B5CF6; --accent-soft: #EDE5FF; }
.ghost-panel { background: linear-gradient(160deg, #24204A, #15132E); color: #fff; max-width: 680px; margin: 0 auto; text-align: center; }
.ghost-panel.shake { animation: shake .4s; }
.g-status { color: #C9C2F2; font-size: 16px; margin-bottom: 10px; min-height: 22px; }
.timer { height: 12px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin: 0 auto 18px; max-width: 420px; }
.timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #A78BFA, #F472B6); border-radius: 99px; }
.g-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 2vw, 14px); margin: 0 auto; max-width: max(300px, calc((100vh - 230px) * 0.78)); }
.room { aspect-ratio: 4 / 5; perspective: 900px; }
.room-inner { position: relative; width: 100%; height: 100%; transition: transform .8s cubic-bezier(.4,0,.2,1); transform-style: preserve-3d; }
.room.foggy .room-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.face.front { background: #fff; color: var(--ink); padding: 6px 4px 8px; }
.face.front img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.face.front .pl { font-size: clamp(10px, 2.6vw, 13px); font-weight: 900; color: #7C3AED; text-transform: uppercase; line-height: 1.1; padding: 0 2px; }
.face.back { background: #2E2960; transform: rotateY(180deg); font-size: clamp(36px, 10vw, 56px); border: 2px solid rgba(167,139,250,.4); }
.room.foggy .face.back { animation: float 2s ease-in-out infinite; }
@keyframes float { 50% { padding-bottom: 14px; } }

/* ---------- Модальные окна ---------- */
.modal {
  position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px;
  background: rgba(30, 27, 60, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.modal.open { display: flex; }
.modal-card { background: #fff; color: var(--ink); width: 100%; max-width: 440px; border-radius: 28px; padding: 26px 22px; text-align: center;
  box-shadow: 0 30px 60px rgba(0,0,0,.25); animation: pop .25s ease both; max-height: calc(100vh - 32px); overflow: auto; }
.modal-card h2 { margin: 6px 0 4px; font-size: 26px; font-weight: 900; }
.modal-card .big { font-size: 54px; }
.modal-card .char-tile { --size: 120px; margin: 0 auto 8px; }
.options { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.option { min-height: 54px; border-radius: 16px; background: var(--soft); font-weight: 800; font-size: 17px; padding: 8px 16px;
  border: 2px solid var(--line); transition: background .15s, border-color .15s; }
.option:hover { border-color: var(--accent); }
.option.correct { background: var(--good); border-color: var(--good); color: #fff; }
.option.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.answer-list { list-style: none; padding: 0; margin: 16px 0 20px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.answer-list li { padding: 10px 14px; border-radius: 14px; font-size: 16px; display: flex; gap: 10px; align-items: center; }
.answer-list li.ok { background: var(--good-soft); } .answer-list li.no { background: var(--bad-soft); }
.answer-list .mark { font-weight: 900; width: 20px; flex-shrink: 0; text-align: center; }
.answer-list li.ok .mark { color: var(--good); } .answer-list li.no .mark { color: var(--bad); }

/* ---------- Negatives ---------- */
#negatives { --accent: #0EA5A4; --accent-soft: #DDF5F4; }
.ng-left { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.ng-chars { display: flex; gap: 12px; justify-content: center; }
.ng-chars .char-tile { --size: clamp(110px, 30vw, 150px); }
.memory {
  width: 100%; background: #FFF6D1; border: 2px dashed #F2C230; border-radius: 20px; padding: 16px 18px;
  font-size: 18px; line-height: 1.55; text-align: center; transition: opacity .3s;
}
.memory .label { color: #B08600; margin-bottom: 6px; }
.memory.hidden { display: none; }
.memory-hidden { display: none; width: 100%; text-align: center; padding: 18px; border-radius: 20px; background: var(--soft); color: var(--muted); }
.memory.hidden + .memory-hidden { display: block; }
.ng-right { display: flex; flex-direction: column; gap: 16px; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 14px; color: var(--muted); }
.legend span { padding: 6px 12px; border-radius: 99px; background: var(--soft); }
.legend .w { background: var(--good-soft); color: var(--good); } .legend .n { background: var(--bad-soft); color: var(--bad); }
.places { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.place {
  min-height: 64px; border-radius: 18px; background: var(--soft); border: 2px solid var(--line); padding: 8px 10px;
  display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; text-align: left; line-height: 1.2;
  transition: background .15s, border-color .15s, transform .1s;
}
.place:active { transform: scale(.97); }
.place .emo { font-size: 24px; flex-shrink: 0; }
.place .st { margin-left: auto; font-size: 13px; font-weight: 900; flex-shrink: 0; }
.place.was { background: var(--good); border-color: var(--good); color: #fff; }
.place.wasnt { background: var(--bad); border-color: var(--bad); color: #fff; }

@media (max-width: 520px) {
  .formula { grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; }
  .formula .op { display: none; }
  .game-card { flex-direction: row; }
  .game-card .art { width: 92px; height: auto; font-size: 40px; flex-shrink: 0; }
  .game-card .body { padding: 14px 16px; gap: 3px; }
  .game-card h3 { font-size: 19px; }
  .game-card p { font-size: 14px; }
  .game-card .play { display: none; }
  .menu-grid { gap: 12px; }
}
@media (max-width: 420px) {
  .f-box { min-height: 120px; padding: 10px; }
  .f-place .txt { font-size: 14px; }
  .f-place .emo { font-size: 34px; }
  .sign-badge { width: 52px; height: 52px; font-size: 28px; }
  .place { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="on-menu">

<header class="topbar">
  <div class="topbar-inner">
    <button class="home-btn" onclick="go('menu')" aria-label="Back to menu" title="Menu">←</button>
    <h1 id="title"></h1>
    <div class="score-chip" id="score"></div>
  </div>
</header>

<main>
  <!-- МЕНЮ -->
  <section class="screen active" id="menu">
    <div class="hero">
      <div class="hero-chars" id="hero-chars"></div>
      <h2>English Grammar Games</h2>
      <p>Spotlight 4 · Past Simple · was / were</p>
    </div>
    <div class="menu-grid">
      <button class="game-card" style="--c:#E4E4FD;--c2:#5B5BD6" onclick="go('order')">
        <div class="art">📝</div>
        <div class="body"><span class="tag">Past Simple</span><h3>Word Order</h3>
          <p>Build the sentence: who, where, and + / − / ?</p><span class="play">Play →</span></div>
      </button>
      <button class="game-card" style="--c:#FFE4CF;--c2:#E8590C" onclick="go('emotions')">
        <div class="art">😊</div>
        <div class="body"><span class="tag">Vocabulary</span><h3>Emotions</h3>
          <p>How were they yesterday? Spell the feeling.</p><span class="play">Play →</span></div>
      </button>
      <button class="game-card" style="--c:#E6DCFF;--c2:#7C3AED" onclick="go('ghost')">
        <div class="art">👻</div>
        <div class="body"><span class="tag">Was / Were · Places</span><h3>Ghost in the School</h3>
          <p>Remember where everyone was before the ghost comes!</p><span class="play">Play →</span></div>
      </button>
      <button class="game-card" style="--c:#D3F2F0;--c2:#0E8F8E" onclick="go('negatives')">
        <div class="art">🚫</div>
        <div class="body"><span class="tag">Was / Wasn't</span><h3>Negatives</h3>
          <p>Read, remember and mark: was or wasn't?</p><span class="play">Play →</span></div>
      </button>
    </div>
  </section>

  <!-- WORD ORDER -->
  <section class="screen" id="order">
    <div class="layout">
      <div class="panel">
        <div class="label" style="text-align:center;margin-bottom:14px">Make a sentence</div>
        <div class="formula">
          <div class="f-box f-chars" id="o-chars"></div>
          <div class="op">+</div>
          <div class="f-box f-place"><div class="emo" id="o-emo"></div><div class="txt" id="o-place"></div></div>
          <div class="op">+</div>
          <div class="f-box f-sign"><div class="sign-badge" id="o-sign"></div><div class="sign-word" id="o-sign-word"></div></div>
        </div>
      </div>
      <div class="panel">
        <div class="feedback" id="o-feedback"></div>
        <div class="sentence-zone" id="o-sentence"></div>
        <div class="word-pool" id="o-pool"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="Order.reset()">↺ Reset</button>
          <button class="btn btn-primary" onclick="Order.next()">Next →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- EMOTIONS -->
  <section class="screen" id="emotions">
    <div class="layout" id="em-wrap">
      <div class="panel em-left">
        <div class="em-sentence" id="em-sentence"></div>
        <div class="em-stage" id="em-stage"></div>
      </div>
      <div class="panel em-right">
        <div class="label" style="text-align:center">Spell the word</div>
        <div class="slots" id="em-slots"></div>
        <div class="keys" id="em-keys"></div>
        <button class="btn btn-primary" id="em-next" style="display:none;align-self:center" onclick="Emotions.next()">Next →</button>
      </div>
    </div>
  </section>

  <!-- GHOST -->
  <section class="screen" id="ghost">
    <div class="panel ghost-panel" id="g-panel">
      <div class="g-status" id="g-status">Remember where everyone is…</div>
      <div class="timer"><div class="timer-fill" id="g-timer"></div></div>
      <div class="g-grid" id="g-grid"></div>
    </div>
  </section>

  <!-- NEGATIVES -->
  <section class="screen" id="negatives">
    <div class="layout">
      <div class="panel ng-left">
        <div class="ng-chars" id="n-chars"></div>
        <div class="memory" id="n-memory">
          <div class="label">Read and remember</div>
          <div id="n-text"></div>
          <button class="btn btn-primary" style="margin-top:14px" onclick="Negatives.hideMemory()">I remember! →</button>
        </div>
        <div class="memory-hidden">🙈 The story is hidden. Mark the places!</div>
      </div>
      <div class="panel ng-right">
        <div class="legend"><span>Tap to change:</span><span class="w">✓ was / were</span><span class="n">✗ wasn't / weren't</span></div>
        <div class="places" id="n-places"></div>
        <button class="btn btn-primary" onclick="Negatives.check()">Check</button>
      </div>
    </div>
  </section>
</main>

<!-- Окна -->

  <div class="modal-card">
    <div class="char-tile" id="g-q-char" style="--tint:#EDE5FF"></div>

</div>

    <div class="big" id="n-r-emoji"></div>
    <h2 id="n-r-title"></h2>
    <div id="n-r-sub" style="color:var(--muted)"></div>
    <ul class="answer-list" id="n-r-list"></ul>
    <button class="btn btn-primary" style="width:100%" id="n-r-btn"></button>
  </div>
</div>

<script>
/*
 * Оригинальные мультяшные персонажи для всех игр.
 * Каждый персонаж: n — имя, g — 'he' / 'she', img — картинка (SVG, рисуется кодом).
 * Чтобы заменить персонажа на свою картинку, укажите вместо img путь к файлу,
 * например: {n: 'Ben', g: 'he', img: 'images/ben.png'}
 */
(function () {
    const OUT = '#3b2f2f';

    const eyes = (y = 58, dx = 13, r = 5) => `
        <circle cx="${60 - dx}" cy="${y}" r="${r}" fill="${OUT}"/>
        <circle cx="${60 + dx}" cy="${y}" r="${r}" fill="${OUT}"/>
        <circle cx="${60 - dx + 1.8}" cy="${y - 1.8}" r="${r * 0.38}" fill="#fff"/>
        <circle cx="${60 + dx + 1.8}" cy="${y - 1.8}" r="${r * 0.38}" fill="#fff"/>`;
    const cheeks = (y = 70) => `
        <ellipse cx="40" cy="${y}" rx="6" ry="4" fill="#ff8fa3" opacity=".55"/>
        <ellipse cx="80" cy="${y}" rx="6" ry="4" fill="#ff8fa3" opacity=".55"/>`;
    const smile = (y = 75) => `<path d="M53 ${y} Q60 ${y + 7} 67 ${y}" stroke="${OUT}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    const nose = (y = 68, c = OUT) => `<ellipse cx="60" cy="${y}" rx="4.5" ry="3.3" fill="${c}"/>`;
    const head = (c, r = 36) => `<circle cx="60" cy="58" r="${r}" fill="${c}"/>`;
    const muzzle = (c, y = 72, rx = 16, ry = 12) => `<ellipse cx="60" cy="${y}" rx="${rx}" ry="${ry}" fill="${c}"/>`;
    const whiskers = `<g stroke="${OUT}" stroke-width="1.4" stroke-linecap="round" opacity=".7">
        <path d="M30 68 L44 70"/><path d="M30 75 L44 73"/><path d="M90 68 L76 70"/><path d="M90 75 L76 73"/></g>`;
    const bow = (c) => `<g transform="translate(86 26) rotate(20)">
        <path d="M0 0 L-13 -9 L-13 9 Z" fill="${c}"/><path d="M0 0 L13 -9 L13 9 Z" fill="${c}"/>
        <circle r="4.5" fill="${c}" stroke="#fff" stroke-width="1.5"/></g>`;
    const cap = (c) => `<path d="M26 40 Q60 6 94 40 Z" fill="${c}"/><path d="M60 38 Q86 34 104 42 L94 42 Z" fill="${c}"/>
        <circle cx="60" cy="16" r="3.5" fill="#fff"/>`;
    const body = (shirt, skin) => `
        <path d="M22 150 Q22 92 60 88 Q98 92 98 150 Z" fill="${shirt}"/>
        <ellipse cx="60" cy="132" rx="15" ry="13" fill="${skin}" opacity=".9"/>`;

    // Каждая функция рисует голову зверька; extra — бантик или кепка.
    const animals = {
        bear: (c) => `<circle cx="30" cy="30" r="12" fill="${c.fur}"/><circle cx="90" cy="30" r="12" fill="${c.fur}"/>
            <circle cx="30" cy="30" r="6" fill="${c.light}"/><circle cx="90" cy="30" r="6" fill="${c.light}"/>
            ${head(c.fur)}${muzzle(c.light)}${eyes()}${nose(67)}${smile(75)}${cheeks()}`,
        cat: (c) => `<path d="M28 44 L30 12 L54 30 Z" fill="${c.fur}"/><path d="M92 44 L90 12 L66 30 Z" fill="${c.fur}"/>
            <path d="M33 36 L34 20 L46 30 Z" fill="#ffb3c1"/><path d="M87 36 L86 20 L74 30 Z" fill="#ffb3c1"/>
            ${head(c.fur)}${muzzle(c.light, 72, 14, 10)}${eyes()}${nose(68, '#ff7f9a')}${smile(73)}${whiskers}${cheeks()}`,
        fox: (c) => `<path d="M26 46 L24 6 L56 30 Z" fill="${c.fur}"/><path d="M94 46 L96 6 L64 30 Z" fill="${c.fur}"/>
            <path d="M31 36 L30 16 L46 30 Z" fill="${OUT}" opacity=".75"/><path d="M89 36 L90 16 L74 30 Z" fill="${OUT}" opacity=".75"/>
            ${head(c.fur)}<path d="M24 60 Q40 58 60 90 Q80 58 96 60 Q94 92 60 94 Q26 92 24 60 Z" fill="${c.light}"/>
            ${eyes(56)}${nose(74)}${smile(80)}${cheeks(72)}`,
        rabbit: (c) => `<ellipse cx="44" cy="16" rx="9" ry="28" fill="${c.fur}"/><ellipse cx="76" cy="16" rx="9" ry="28" fill="${c.fur}"/>
            <ellipse cx="44" cy="16" rx="4.5" ry="20" fill="#ffb3c1"/><ellipse cx="76" cy="16" rx="4.5" ry="20" fill="#ffb3c1"/>
            ${head(c.fur)}${muzzle(c.light, 72, 13, 10)}${eyes()}${nose(68, '#ff7f9a')}
            <rect x="56" y="74" width="8" height="7" rx="2" fill="#fff" stroke="${OUT}" stroke-width="1"/>${cheeks()}`,
        mouse: (c) => `<circle cx="24" cy="34" r="20" fill="${c.fur}"/><circle cx="96" cy="34" r="20" fill="${c.fur}"/>
            <circle cx="24" cy="34" r="12" fill="#ffb3c1"/><circle cx="96" cy="34" r="12" fill="#ffb3c1"/>
            ${head(c.fur, 33)}${eyes(58, 12)}${nose(70, '#ff7f9a')}${smile(76)}${whiskers}${cheeks()}`,
        pig: (c) => `<path d="M30 40 L28 18 L48 28 Z" fill="${c.dark}"/><path d="M90 40 L92 18 L72 28 Z" fill="${c.dark}"/>
            ${head(c.fur)}<ellipse cx="60" cy="70" rx="13" ry="9" fill="${c.dark}"/>
            <ellipse cx="55" cy="70" rx="2.6" ry="3.5" fill="${OUT}"/><ellipse cx="65" cy="70" rx="2.6" ry="3.5" fill="${OUT}"/>
            ${eyes(54)}<path d="M53 82 Q60 87 67 82" stroke="${OUT}" stroke-width="2.5" fill="none" stroke-linecap="round"/>${cheeks(68)}`,
        panda: (c) => `<circle cx="30" cy="30" r="12" fill="${OUT}"/><circle cx="90" cy="30" r="12" fill="${OUT}"/>
            ${head('#fff')}<circle cx="60" cy="58" r="36" fill="none" stroke="#e5e5e5" stroke-width="2"/>
            <ellipse cx="46" cy="58" rx="9" ry="11" fill="${OUT}" transform="rotate(-25 46 58)"/>
            <ellipse cx="74" cy="58" rx="9" ry="11" fill="${OUT}" transform="rotate(25 74 58)"/>
            <circle cx="47" cy="57" r="4" fill="#fff"/><circle cx="73" cy="57" r="4" fill="#fff"/>
            <circle cx="47.5" cy="57.5" r="2.3" fill="${OUT}"/><circle cx="72.5" cy="57.5" r="2.3" fill="${OUT}"/>
            ${nose(70)}${smile(76)}${cheeks(72)}`,
        frog: (c) => `<ellipse cx="60" cy="64" rx="40" ry="32" fill="${c.fur}"/>
            <circle cx="40" cy="34" r="15" fill="${c.fur}"/><circle cx="80" cy="34" r="15" fill="${c.fur}"/>
            <circle cx="40" cy="34" r="9" fill="#fff"/><circle cx="80" cy="34" r="9" fill="#fff"/>
            <circle cx="41" cy="35" r="5" fill="${OUT}"/><circle cx="81" cy="35" r="5" fill="${OUT}"/>
            <path d="M40 70 Q60 86 80 70" stroke="${OUT}" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="56" cy="58" r="1.6" fill="${OUT}"/><circle cx="64" cy="58" r="1.6" fill="${OUT}"/>${cheeks(70)}`,
        owl: (c) => `<path d="M26 34 L30 10 L46 26 Z" fill="${c.fur}"/><path d="M94 34 L90 10 L74 26 Z" fill="${c.fur}"/>
            ${head(c.fur)}<circle cx="45" cy="56" r="14" fill="#fff"/><circle cx="75" cy="56" r="14" fill="#fff"/>
            <circle cx="45" cy="57" r="7" fill="${OUT}"/><circle cx="75" cy="57" r="7" fill="${OUT}"/>
            <circle cx="47" cy="55" r="2.5" fill="#fff"/><circle cx="77" cy="55" r="2.5" fill="#fff"/>
            <path d="M54 68 L66 68 L60 80 Z" fill="#f5a623"/>
            <path d="M40 86 Q45 82 50 86 M55 88 Q60 84 65 88 M70 86 Q75 82 80 86" stroke="${c.light}" stroke-width="2" fill="none"/>`,
        penguin: (c) => `${head(OUT)}<path d="M60 40 Q30 34 32 66 Q34 92 60 92 Q86 92 88 66 Q90 34 60 40 Z" fill="#fff"/>
            ${eyes(58, 12)}<path d="M51 68 L69 68 L60 78 Z" fill="#f5a623"/>${cheeks(72)}`,
        lion: (c) => `<circle cx="60" cy="58" r="48" fill="${c.dark}"/>
            ${[0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map(a => {
                const x = 60 + 44 * Math.cos(a * Math.PI / 180), y = 58 + 44 * Math.sin(a * Math.PI / 180);
                return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="${c.dark}"/>`;
            }).join('')}
            <circle cx="32" cy="32" r="9" fill="${c.fur}"/><circle cx="88" cy="32" r="9" fill="${c.fur}"/>
            ${head(c.fur, 33)}${muzzle(c.light, 72, 14, 10)}${eyes(56, 12)}${nose(68)}${smile(74)}${whiskers}`,
        dog: (c) => `${head(c.fur)}<ellipse cx="26" cy="56" rx="11" ry="24" fill="${c.dark}" transform="rotate(15 26 56)"/>
            <ellipse cx="94" cy="56" rx="11" ry="24" fill="${c.dark}" transform="rotate(-15 94 56)"/>
            <ellipse cx="72" cy="52" rx="10" ry="9" fill="${c.dark}" opacity=".6"/>
            ${muzzle(c.light, 73, 15, 11)}${eyes()}${nose(68)}${smile(75)}
            <path d="M57 79 Q60 89 63 79 Z" fill="#ff7f9a"/>${cheeks()}`,
        koala: (c) => `<circle cx="26" cy="38" r="18" fill="${c.fur}"/><circle cx="94" cy="38" r="18" fill="${c.fur}"/>
            <circle cx="26" cy="38" r="10" fill="${c.light}"/><circle cx="94" cy="38" r="10" fill="${c.light}"/>
            ${head(c.fur, 34)}${eyes(54, 14, 4.5)}<ellipse cx="60" cy="66" rx="8" ry="11" fill="${OUT}"/>
            ${smile(80)}${cheeks(70)}`,
        monkey: (c) => `<circle cx="22" cy="58" r="12" fill="${c.fur}"/><circle cx="98" cy="58" r="12" fill="${c.fur}"/>
            <circle cx="22" cy="58" r="7" fill="${c.light}"/><circle cx="98" cy="58" r="7" fill="${c.light}"/>
            ${head(c.fur)}<path d="M60 44 Q48 32 38 46 Q28 62 40 74 Q50 90 60 90 Q70 90 80 74 Q92 62 82 46 Q72 32 60 44 Z" fill="${c.light}"/>
            ${eyes(56, 11)}<circle cx="57" cy="68" r="1.6" fill="${OUT}"/><circle cx="63" cy="68" r="1.6" fill="${OUT}"/>${smile(76)}`,
        tiger: (c) => `<circle cx="30" cy="30" r="11" fill="${c.fur}"/><circle cx="90" cy="30" r="11" fill="${c.fur}"/>
            <circle cx="30" cy="30" r="5" fill="${OUT}"/><circle cx="90" cy="30" r="5" fill="${OUT}"/>
            ${head(c.fur)}<g fill="${OUT}"><path d="M56 23 L60 38 L64 23 Z"/><path d="M26 52 L40 55 L26 60 Z"/>
            <path d="M94 52 L80 55 L94 60 Z"/><path d="M28 66 L38 67 L29 72 Z"/><path d="M92 66 L82 67 L91 72 Z"/></g>
            ${muzzle('#fff', 72, 15, 11)}${eyes()}${nose(68, '#ff7f9a')}${smile(74)}${whiskers}`,
        raccoon: (c) => `<path d="M28 42 L30 14 L52 28 Z" fill="${c.fur}"/><path d="M92 42 L90 14 L68 28 Z" fill="${c.fur}"/>
            ${head(c.fur)}<path d="M28 58 Q44 44 60 56 Q76 44 92 58 Q78 70 60 62 Q42 70 28 58 Z" fill="${OUT}"/>
            ${muzzle('#fff', 74, 14, 10)}<circle cx="47" cy="58" r="4" fill="#fff"/><circle cx="73" cy="58" r="4" fill="#fff"/>
            <circle cx="47" cy="58" r="2.2" fill="${OUT}"/><circle cx="73" cy="58" r="2.2" fill="${OUT}"/>${nose(70)}${smile(76)}`,
        sheep: (c) => `${[[34, 34], [48, 26], [60, 23], [72, 26], [86, 34], [92, 50], [28, 50]].map(([x, y]) =>
                `<circle cx="${x}" cy="${y}" r="14" fill="#fff" stroke="#e8e2d8" stroke-width="2"/>`).join('')}
            <ellipse cx="24" cy="62" rx="12" ry="6" fill="${c.fur}" transform="rotate(-20 24 62)"/>
            <ellipse cx="96" cy="62" rx="12" ry="6" fill="${c.fur}" transform="rotate(20 96 62)"/>
            <ellipse cx="60" cy="64" rx="28" ry="30" fill="${c.fur}"/>
            ${[[44, 38], [60, 34], [76, 38]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="12" fill="#fff"/>`).join('')}
            ${eyes(62, 11, 4.5)}${nose(74, '#ff7f9a')}${smile(80)}${cheeks(74)}`,
        chick: (c) => `<path d="M56 24 Q58 10 62 22 Q66 12 66 26 Z" fill="${c.fur}"/>
            ${head(c.fur)}${eyes(56, 12)}<path d="M50 66 L70 66 L60 78 Z" fill="#f57c00"/>${cheeks(70)}`,
    };

    const list = [
        {n: 'Ben',    g: 'he',  a: 'bear',    fur: '#b07a4f', light: '#e8c9a4', shirt: '#4a90e2', hat: '#e74c3c'},
        {n: 'Lily',   g: 'she', a: 'cat',     fur: '#f2a65a', light: '#ffe3c4', shirt: '#9b59b6', bow: '#ff4f8b'},
        {n: 'Emma',   g: 'she', a: 'fox',     fur: '#ef7a2a', light: '#fff4e6', shirt: '#2ecc71', bow: '#ffd23f'},
        {n: 'Rosie',  g: 'she', a: 'rabbit',  fur: '#f4ede4', light: '#ffffff', shirt: '#ff8fab', bow: '#7c5cff'},
        {n: 'Milo',   g: 'he',  a: 'mouse',   fur: '#a8a8b3', light: '#d9d9e0', shirt: '#f39c12'},
        {n: 'Poppy',  g: 'she', a: 'pig',     fur: '#ffc2cf', dark: '#ff9db2', shirt: '#26a69a', bow: '#4a90e2'},
        {n: 'Bella',  g: 'she', a: 'panda',   shirt: '#e74c3c', bow: '#ff4f8b'},
        {n: 'Sam',    g: 'he',  a: 'frog',    fur: '#6cc04a', shirt: '#3f51b5'},
        {n: 'Molly',  g: 'she', a: 'owl',     fur: '#9c7b5b', light: '#d8c3a5', shirt: '#00acc1', bow: '#ff4f8b'},
        {n: 'Pip',    g: 'he',  a: 'penguin', shirt: '#e53935'},
        {n: 'Leo',    g: 'he',  a: 'lion',    fur: '#f7c35f', light: '#fff0c9', dark: '#c4782e', shirt: '#43a047'},
        {n: 'Max',    g: 'he',  a: 'dog',     fur: '#f0dcc0', light: '#fff8ee', dark: '#8d6748', shirt: '#1e88e5', hat: '#43a047'},
        {n: 'Mia',    g: 'she', a: 'koala',   fur: '#9aa3ad', light: '#e3e7ec', shirt: '#ffb300', bow: '#e53935'},
        {n: 'Ollie',  g: 'he',  a: 'monkey',  fur: '#8b5a3c', light: '#f0c9a0', shirt: '#fdd835'},
        {n: 'Toby',   g: 'he',  a: 'tiger',   fur: '#f59a2e', shirt: '#5e35b1', hat: '#00897b'},
        {n: 'Jack',   g: 'he',  a: 'raccoon', fur: '#8f939a', shirt: '#d81b60'},
        {n: 'Daisy',  g: 'she', a: 'sheep',   fur: '#5b4a42', shirt: '#7cb342', bow: '#ffd23f'},
        {n: 'Lucy',   g: 'she', a: 'chick',   fur: '#ffd84d', shirt: '#ec407a', bow: '#4a90e2'},
    ];

    const skinOf = (c) => c.light || c.fur || '#fff';

    function draw(c) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 120 160">
            ${body(c.shirt, c.a === 'penguin' || c.a === 'panda' ? '#fff' : skinOf(c))}
            ${animals[c.a](c)}
            ${c.bow ? bow(c.bow) : ''}${c.hat ? cap(c.hat) : ''}
        </svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace(/\s+/g, ' '));
    }

    window.CHARACTERS = list.map(c => ({n: c.n, g: c.g, animal: c.a, img: draw(c)}));
})();

</script>
<script>
/* ===== Общие данные ===== */
const PLACES = [
  { name: "at home", emo: "🏠" }, { name: "at school", emo: "🏫" }, { name: "at work", emo: "💼" },
  { name: "at my uncle's house", emo: "🏡" }, { name: "at the cafe", emo: "☕" }, { name: "at the cinema", emo: "🎬" },
  { name: "at the circus", emo: "🎪" }, { name: "at the hospital", emo: "🏥" }, { name: "at the party", emo: "🥳" },
  { name: "at the shops", emo: "🛍️" }, { name: "at the theatre", emo: "🎭" }, { name: "at the zoo", emo: "🦁" },
  { name: "at the museum", emo: "🏛️" }, { name: "in bed", emo: "🛌" }, { name: "in London", emo: "🎡" },
  { name: "in the garden", emo: "🌻" }, { name: "in the room", emo: "🛋️" }, { name: "in the park", emo: "🌳" },
  { name: "on holiday", emo: "🏖️" }, { name: "with my friend", emo: "👫" }
];
const TINTS = ['#ECECFD', '#FFEBDD', '#E3F7EF', '#FFF3D6', '#FDE7F0', '#E0F0FF'];

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const $ = id => document.getElementById(id);
const tileHTML = (c, i = 0) => `<div class="char-tile" style="--tint:${TINTS[i % TINTS.length]}"><img src="${c.img}" alt="${c.n}"></div>`;
const pronoun = kids => kids.length > 1 ? 'they' : kids[0].g;

/* ===== Навигация ===== */
const GAMES = {
  order: { title: '📝 Word Order', obj: () => Order },
  emotions: { title: '😊 Emotions', obj: () => Emotions },
  ghost: { title: '👻 Ghost in the School', obj: () => Ghost },
  negatives: { title: '🚫 Was / Wasn\'t', obj: () => Negatives },
};
let current = 'menu';
function setScore(t) { $('score').textContent = t; }
function go(name) {
  if (GAMES[current]) GAMES[current].obj().stop?.();
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === name));
  document.body.classList.toggle('on-menu', name === 'menu');
  current = name;
  setScore('');
  if (GAMES[name]) { $('title').textContent = GAMES[name].title; GAMES[name].obj().start(); }
  window.scrollTo(0, 0);
}

/* ===== 1. Word Order ===== */
const Order = {
  score: 0, correct: [], placed: [], pool: [], solved: false,
  start() { this.score = 0; this.next(); },
  next() {
    const plural = Math.random() > 0.5;
    const kids = pick(CHARACTERS, plural ? 2 : 1);
    const place = PLACES[Math.floor(Math.random() * PLACES.length)];
    const sign = ['+', '-', '?'][Math.floor(Math.random() * 3)];
    $('o-chars').innerHTML = kids.map((k, i) => tileHTML(k, i)).join('');
    $('o-emo').textContent = place.emo;
    $('o-place').textContent = place.name;
    const badge = $('o-sign');
    badge.textContent = sign === '-' ? '−' : sign;
    badge.className = 'sign-badge ' + { '+': 'pos', '-': 'neg', '?': 'que' }[sign];
    $('o-sign-word').textContent = { '+': 'positive', '-': 'negative', '?': 'question' }[sign];

    const subj = pronoun(kids), verb = plural ? 'were' : 'was';
    let s;
    if (sign === '+') s = `${subj} ${verb} ${place.name}`;
    else if (sign === '-') s = `${subj} ${verb} not ${place.name}`;
    else s = `${verb} ${subj} ${place.name} ?`;
    this.correct = s.toLowerCase().split(' ').filter(Boolean);
    this.reset();
    this.render();
  },
  reset() { this.placed = []; this.pool = shuffle(this.correct); this.solved = false; this.render(); },
  take(i) { this.placed.push(this.pool.splice(i, 1)[0]); this.render(); },
  back(i) { if (this.solved) return; this.pool.push(this.placed.splice(i, 1)[0]); this.render(); },
  render() {
    const zone = $('o-sentence'), fb = $('o-feedback');
    zone.innerHTML = ''; $('o-pool').innerHTML = '';
    this.placed.forEach((w, i) => zone.appendChild(Object.assign(document.createElement('button'), { className: 'chip', textContent: w, onclick: () => this.back(i) })));
    this.pool.forEach((w, i) => $('o-pool').appendChild(Object.assign(document.createElement('button'), { className: 'chip', textContent: w, onclick: () => this.take(i) })));
    zone.className = 'sentence-zone'; fb.className = 'feedback'; fb.textContent = '';
    if (this.pool.length === 0 && this.placed.length) {
      const ok = this.placed.join(' ') === this.correct.join(' ');
      zone.classList.add(ok ? 'good' : 'bad'); fb.classList.add(ok ? 'good' : 'bad');
      fb.textContent = ok ? 'Excellent! 🌟' : 'Try again! Tap a word to move it back 🔄';
      if (ok && !this.solved) { this.solved = true; this.score++; }
    }
    setScore(`⭐ ${this.score}`);
  },
};

/* ===== 2. Emotions ===== */
const MOODS = [
  { word: 'angry', emoji: '💢' }, { word: 'scared', emoji: '😱' }, { word: 'sad', emoji: '😢' },
  { word: 'happy', emoji: '😊' }, { word: 'tired', emoji: '🥱' }, { word: 'hungry', emoji: '🍕' }, { word: 'bored', emoji: '😑' }
];
const Emotions = {
  score: 0, target: '', typed: '', last: null,
  start() { this.score = 0; setScore('⭐ 0'); this.next(); },
  next() {
    this.typed = '';
    $('em-wrap').classList.remove('win');
    $('em-next').style.display = 'none';
    const kids = pick(CHARACTERS, Math.random() > 0.6 ? 2 : 1);
    let mood; do { mood = MOODS[Math.floor(Math.random() * MOODS.length)]; } while (mood === this.last);
    this.last = mood; this.target = mood.word;
    $('em-stage').innerHTML = kids.map((k, i) => tileHTML(k, i + 1)).join('') + `<div class="em-emoji">${mood.emoji}</div>`;
    this.sentence = kids.length === 2 ? 'Yesterday they were…' : `Yesterday ${kids[0].g} was…`;
    $('em-sentence').textContent = this.sentence;
    $('em-slots').innerHTML = [...this.target].map((_, i) => `<div class="slot" id="slot-${i}"></div>`).join('');
    const keys = $('em-keys'); keys.innerHTML = '';
    shuffle([...this.target]).forEach(ch => {
      const b = Object.assign(document.createElement('button'), { className: 'key', textContent: ch });
      b.onclick = () => this.press(ch, b);
      keys.appendChild(b);
    });
  },
  press(ch, b) {
    if (ch === this.target[this.typed.length]) {
      const s = $(`slot-${this.typed.length}`); s.textContent = ch; s.classList.add('filled');
      this.typed += ch; b.disabled = true;
      if (this.typed === this.target) {
        this.score++; setScore(`⭐ ${this.score}`);
        $('em-wrap').classList.add('win');
        $('em-sentence').innerHTML = `${this.sentence.replace('…', '')} <span class="ans">${this.target}!</span>`;
        $('em-next').style.display = 'inline-flex';
      }
    } else {
      b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
    }
  },
};

/* ===== 3. Ghost in the School ===== */
const Ghost = {
  score: 0, data: [], target: null, answering: false, timers: [], audio: null,
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); },
  stop() { this.timers.forEach(clearTimeout); this.timers = []; $('g-modal').classList.remove('open'); },
  start() { this.stop(); this.score = 0; setScore('👻 0'); this.round(); },
  round() {
    this.answering = false;
    $('g-modal').classList.remove('open');
    $('g-status').textContent = 'Remember where everyone is…';
    const fill = $('g-timer'); fill.style.transition = 'none'; fill.style.width = '100%';
    const kids = pick(CHARACTERS, 9), places = pick(PLACES, 9);
    this.data = kids.map((kid, i) => ({ kid, place: places[i] }));
    $('g-grid').innerHTML = this.data.map(({ kid, place }) => `
      <div class="room"><div class="room-inner">
        <div class="face front"><img src="${kid.img}" alt="${kid.n}"><div class="pl">${place.emo} ${place.name}</div></div>
        <div class="face back">👻</div>
      </div></div>`).join('');
    this.later(() => { fill.style.transition = 'width 5s linear'; fill.style.width = '0%'; }, 100);
    this.later(() => this.fog(), 5100);
  },
  boo() {
    try {
      this.audio = this.audio || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = this.audio, osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 1.2);
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
      osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 1.2);
    } catch (e) {}
  },
  fog() {
    this.boo();
    $('g-status').textContent = 'Boo! The ghost is here!';
    const p = $('g-panel'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
    document.querySelectorAll('.room').forEach(r => r.classList.add('foggy'));
    this.later(() => this.quiz(), 1000);
  },
  quiz() {
    const t = this.target = this.data[Math.floor(Math.random() * 9)];
    $('g-q-char').innerHTML = `<img src="${t.kid.img}" alt="${t.kid.n}">`;
    $('g-q-text').textContent = `Where was ${t.kid.n}?`;
    const he = cap(t.kid.g);
    const correct = `${he} was ${t.place.name}.`;
    const opts = [correct];
    while (opts.length < 4) {
      const s = `${he} was ${PLACES[Math.floor(Math.random() * PLACES.length)].name}.`;
      if (!opts.includes(s)) opts.push(s);
    }
    const box = $('g-options'); box.innerHTML = '';
    shuffle(opts).forEach(o => {
      const b = Object.assign(document.createElement('button'), { className: 'option', textContent: o });
      b.onclick = () => {
        if (this.answering) return; this.answering = true;
        if (o === correct) { b.classList.add('correct'); this.score++; }
        else {
          b.classList.add('wrong'); this.score = Math.max(0, this.score - 1);
          [...box.children].forEach(x => { if (x.textContent === correct) x.classList.add('correct'); });
        }
        setScore(`👻 ${this.score}`);
        this.later(() => this.round(), 2000);
      };
      box.appendChild(b);
    });
    $('g-modal').classList.add('open');
  },
};

/* ===== 4. Negatives ===== */
const Negatives = {
  score: 0, goal: 30, kids: [], choices: [],
  start() { this.score = 0; this.round(); },
  round() {
    $('n-modal').classList.remove('open');
    setScore(`✅ ${this.score} / ${this.goal}`);
    const multiple = Math.random() < 0.3;
    this.kids = pick(CHARACTERS, multiple ? 2 : 1);
    $('n-chars').innerHTML = this.kids.map((k, i) => tileHTML(k, i + 2)).join('');
    this.choices = pick(PLACES, 6).map(p => ({ place: p, correct: Math.random() > 0.5, user: null }));
    const subj = multiple ? 'We' : 'I';
    $('n-text').innerHTML = this.choices.map(c =>
      `${subj} ${c.correct ? (multiple ? 'were' : 'was') : (multiple ? "weren't" : "wasn't")} ${c.place.name}.`).join(' ');
    $('n-memory').classList.remove('hidden');
    const grid = $('n-places'); grid.innerHTML = '';
    this.choices.forEach(c => {
      const b = document.createElement('button');
      b.className = 'place';
      const paint = () => {
        b.className = 'place' + (c.user === true ? ' was' : c.user === false ? ' wasnt' : '');
        b.innerHTML = `<span class="emo">${c.place.emo}</span><span>${c.place.name}</span><span class="st">${c.user === true ? '✓' : c.user === false ? '✗' : ''}</span>`;
      };
      b.onclick = () => {
        this.hideMemory();
        c.user = c.user === null ? true : c.user === true ? false : null;
        paint();
      };
      paint(); grid.appendChild(b);
    });
  },
  hideMemory() { $('n-memory').classList.add('hidden'); },
  check() {
    const ok = this.choices.every(c => c.user === c.correct);
    this.score += ok ? 1 : -2;
    setScore(`✅ ${this.score} / ${this.goal}`);
    const plural = this.kids.length > 1;
    const s = plural ? 'They' : cap(this.kids[0].g);
    const btn = $('n-r-btn');
    if (this.score >= this.goal) {
      $('n-r-emoji').textContent = '🎉'; $('n-r-title').textContent = 'YOU WIN!';
      $('n-r-sub').textContent = 'Fantastic English skills!'; $('n-r-list').innerHTML = '';
      btn.textContent = 'Play again'; btn.onclick = () => this.start();
    } else {
      $('n-r-emoji').textContent = ok ? '🌈' : '🤔';
      $('n-r-title').textContent = ok ? "Well done! That's correct!" : 'Oops! Not quite right.';
      $('n-r-sub').textContent = ok ? '+1 point' : '−2 points · Remember:';
      $('n-r-list').innerHTML = ok ? '' : this.choices.map(c => {
        const right = c.user === c.correct;
        const v = c.correct ? (plural ? 'were' : 'was') : (plural ? "weren't" : "wasn't");
        return `<li class="${right ? 'ok' : 'no'}"><span class="mark">${right ? '✓' : '✗'}</span>${s} ${v} ${c.place.name}.</li>`;
      }).join('');
      btn.textContent = 'Next round →'; btn.onclick = () => this.round();
    }
    $('n-modal').classList.add('open');
  },
};

/* ===== Меню ===== */
$('hero-chars').innerHTML = pick(CHARACTERS, 5).map(c => `<img src="${c.img}" alt="">`).join('');
</script>
